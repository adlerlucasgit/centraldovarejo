<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - Central do Varejo</title>
</head>

<body>
    <h1>Cadastrar Produto</h1>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Salvar Produto</button>
    </form>

    <p>
        <a href="{% url 'listar_produtos' %}">Voltar para produtos</a>
    </p>
</body>

</html>
