{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Central do Varejo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/central.css' %}">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #F5F6F7;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 14px;
            padding: 36px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
        }

        .login-logo {
            text-align: center;
            color: #1E8E3E;
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            text-align: center;
            color: #6C757D;
            margin-bottom: 28px;
        }

        .login-card p {
            margin-bottom: 18px;
        }

        .login-card label {
            display: block;
            font-weight: 500;
            margin-bottom: 7px;
        }

        .login-card input[type="text"],
        .login-card input[type="password"] {
            display: block;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .login-card input:focus {
            outline: none;
            border-color: #1E8E3E;
            box-shadow: 0 0 0 3px rgba(30, 142, 62, 0.12);
        }

        .login-card .helptext {
            display: block;
            color: #6C757D;
            font-size: 12px;
            margin-top: 5px;
        }

        .login-card ul.errorlist {
            color: #DC3545;
            font-size: 13px;
            padding-left: 18px;
            margin-top: 5px;
        }

        .btn-login {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1E8E3E;
            color: #FFFFFF;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #176F32;
        }

        .login-footer {
            text-align: center;
            color: #6C757D;
            font-size: 13px;
            margin-top: 24px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <div class="login-logo">
                <i class="bi bi-shop"></i>
                Central do Varejo
            </div>

            <p class="login-subtitle">
                Acesse sua conta para continuar.
            </p>

            {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Entrar no sistema
                </button>

            </form>

        </div>

        <footer class="login-footer">
            Central do Varejo
        </footer>

    </main>

</body>

</html>
